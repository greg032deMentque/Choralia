<app-modal [title]="title()" [showCloseButton]="false" (closed)="cancel()">
  <div class="d-flex gap-3 align-items-start">
    <app-icon
      class="confirm-modal__icon"
      [class.confirm-modal__icon--danger]="danger()"
      [name]="danger() ? IconNameEnum.Warning : IconNameEnum.Question"
      size="empty-state"
      [attr.aria-hidden]="true"
    />
    <div class="flex-grow-1">
      <p class="confirm-modal__message">{{ message() }}</p>

      @if (impacts().length) {
        <ul class="confirm-modal__impacts">
          @for (impact of impacts(); track impact) {
            <li>{{ impact }}</li>
          }
        </ul>
      }

      @if (confirmationKeyword(); as keyword) {
        <div class="mt-3">
          <label class="form-label" for="confirm-modal-keyword">Saisir « {{ keyword }} » pour confirmer</label>
          <input id="confirm-modal-keyword" type="text" class="form-control" [formControl]="keywordControl" />
        </div>
      }
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Annuler</button>
    <button
      type="button"
      class="btn"
      [class.btn-danger]="danger()"
      [class.btn-primary]="!danger()"
      [disabled]="confirmDisabled()"
      (click)="confirm()"
    >
      {{ confirmationLabel() }}
    </button>
  </div>
</app-modal>
