<div class="not-found page">
  <app-icon [name]="IconNameEnum.MagnifyingGlass" size="empty-state" [ariaLabel]="'Page introuvable'" />
  <h1 class="not-found__title">Page introuvable</h1>
  <p class="not-found__subtitle">La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <button type="button" class="btn btn-primary" (click)="goToDashboard()">Retour au tableau de bord</button>
</div>
