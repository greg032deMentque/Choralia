<div class="verify-email-page">
  <div class="verify-email-card">
    <div class="verify-email-card__brand">
      <app-icon [name]="IconNameEnum.MusicNotes" size="nav" [ariaLabel]="'Choralia'" />
      <span class="verify-email-card__brand-name">Choralia</span>
    </div>

    @if (loading()) {
      <div class="verify-email-card__state" role="status" aria-live="polite">
        <span class="spinner-border" aria-hidden="true"></span>
        <p>Vérification de votre email...</p>
      </div>
    } @else if (verified()) {
      <div class="alert alert-success" role="status" aria-live="polite">
        <app-icon [name]="IconNameEnum.CheckCircle" size="dense" [ariaLabel]="null" />
        Email vérifié. Redirection en cours...
      </div>
    } @else {
      <div class="alert alert-danger" role="alert" aria-live="assertive">{{ error() }}</div>

      <div class="d-flex flex-column gap-2">
        <a [routerLink]="'/' + RoutePaths.Registration + '/' + RoutePaths.RegistrationConfirm" class="btn btn-outline-primary">
          Recevoir un nouveau lien
        </a>
        <a [routerLink]="'/' + RoutePaths.Login" class="btn btn-primary">Se connecter</a>
      </div>
    }
  </div>
</div>
