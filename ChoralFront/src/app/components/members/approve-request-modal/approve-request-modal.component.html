<app-modal [title]="'Admettre ' + request().UserFullName" (closed)="cancel()">
  <p class="approve-request-modal__hint">Une voix et un rôle sont nécessaires pour finaliser l'admission.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label for="main-voice-part" class="form-label">Voix principale</label>
      <select
        id="main-voice-part"
        class="form-select"
        formControlName="primaryVoicePart"
        [class.is-invalid]="form.controls.primaryVoicePart.invalid && form.controls.primaryVoicePart.touched"
      >
        <option [ngValue]="null">Choisir...</option>
        @for (voicePart of voicePartDisponibles; track voicePart) {
          <option [ngValue]="voicePart">{{ getVoicePartLabel(voicePart) }}</option>
        }
      </select>
      @if (form.controls.primaryVoicePart.invalid && form.controls.primaryVoicePart.touched) {
        <div class="invalid-feedback">La voix principale est obligatoire.</div>
      }
    </div>

    <div class="mb-4">
      <label for="role" class="form-label">Rôle</label>
      <select
        id="role"
        class="form-select"
        formControlName="role"
        [class.is-invalid]="form.controls.role.invalid && form.controls.role.touched"
      >
        @for (role of rolesAdmissibles; track role) {
          <option [ngValue]="role">{{ getUserRoleLabel(role) }}</option>
        }
      </select>
      @if (form.controls.role.invalid && form.controls.role.touched) {
        <div class="invalid-feedback">Le rôle est obligatoire.</div>
      }
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        Admettre
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()" [disabled]="isSubmitting()">Annuler</button>
    </div>
  </form>
</app-modal>
