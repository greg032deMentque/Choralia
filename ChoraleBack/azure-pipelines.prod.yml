trigger:
  branches:
    include:
      - master
  paths:
    include:
      - ChoraleBack/**

pr: none

variables:
  azureSubscription: 'chorale-service-connection'
  appServiceName: 'choralia-api-prod'
  resourceGroup: 'chorale-prod-rg'

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildJob
        displayName: Restore · Build · Test · Publish
        steps:

          - template: templates/build-and-test.yml
            parameters:
              publishArtifact: true

  - stage: DeployProd
    displayName: Deploy → Production
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToProduction
        displayName: Azure App Service (prod)
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Deploy App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(appServiceName)
                    resourceGroupName: $(resourceGroup)
                    package: $(Pipeline.Workspace)/chorale-api/*.zip
                    deploymentMethod: zipDeploy
